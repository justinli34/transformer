[project]
name = "transformer"
version = "0.1.0"
description = "Transformer Implementation in PyTorch"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.14.1",
]

[project.scripts]
transformer = "transformer.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff]
line-length = 120

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
